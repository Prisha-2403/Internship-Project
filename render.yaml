# Render Blueprint: the API and the static frontend.
#
# The database lives on Supabase; both services here are free-tier. Import with
# New > Blueprint in Render and supply the values marked `sync: false`.
services:
  - type: web
    name: sentinel-finance-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # Supabase pooler connection string, including ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render and kept stable across deploys.
      - key: SECRET_KEY
        generateValue: true

      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # The API and the frontend sit on different domains, so the refresh
      # cookie has to be cross-site. SameSite=None is only honoured on a
      # Secure cookie, which is why the two always travel together.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none

      # Set to the Netlify URL once it exists.
      - key: CORS_ORIGINS
        sync: false

      - key: ML_ARTIFACT_DIR
        value: artifacts
      - key: DEMO_DATA_ENABLED
        value: "true"

  - type: web
    name: sentinel-finance-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Every path is served by index.html so refreshing on /transactions
    # resolves in the router rather than 404-ing.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    envVars:
      # Compiled into the bundle at build time, so changing it needs a rebuild.
      # Set to the API service's URL, with no trailing slash.
      - key: VITE_API_BASE_URL
        sync: false
      # Not secrets - the sign-in hints on the login page. The password is
      # generated by the seeder and never shipped to the browser.
      - key: VITE_DEMO_ANALYST_EMAIL
        value: analyst@sentinel.demo
      - key: VITE_DEMO_SENIOR_ANALYST_EMAIL
        value: senior.analyst@sentinel.demo
      - key: VITE_DEMO_MANAGER_EMAIL
        value: manager@sentinel.demo
      - key: VITE_DEMO_ADMIN_EMAIL
        value: admin@sentinel.demo
